<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>APR Portfolio Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/styles.css?v=2026-10-03b">
</head>
<body>

<div class="deck">
 <div class="wrap" style="padding-block:0">
  <div class="row">
   <label class="ctl" for="fFac">Faculty<select id="fFac"></select></label>
   <label class="ctl" for="fLv">Level<select id="fLv"></select></label>
   <label class="ctl" for="fCat">Category<select id="fCat"></select></label>
   <label class="ctl" for="fLm" id="fLmLab">Labour market<select id="fLm"></select></label>
   <label class="chk" for="fTeach"><input type="checkbox" id="fTeach" checked> Include terminated / suspended</label>
   <span class="scope" id="scope"></span>
  </div>
  <details class="params" id="paramBox">
   <summary>Analysis parameters</summary>
   <div class="row">
    <label class="ctl" for="pTrend">Trend basis<select id="pTrend"><option value="c3">3-year CAGR</option><option value="c10">10-year CAGR</option></select></label>
    <label class="ctl" for="pGrow">Growing if CAGR ≥ (%)<input type="number" id="pGrow" step="0.5" value="0"></label>
    <label class="ctl" for="pMarg">Margin line<select id="pMarg"><option value="thr">Costing-table threshold</option><option value="zero">Break-even ($0)</option></select></label>
    <label class="ctl" for="pSmUG">Subscale: UG/diploma &lt;<input type="number" id="pSmUG" value="25" min="0"></label>
    <label class="ctl" for="pSmGR">Subscale: graduate &lt;<input type="number" id="pSmGR" value="8" min="0"></label>
    <label class="ctl" for="pMinN">Trend needs 10-yr avg ≥<input type="number" id="pMinN" value="0" min="0"></label>
    <label class="ctl" for="pLm">Labour-market lens<select id="pLm"><option value="lma">LMA signal (AD)</option><option value="emp">NS employment outlook (AE)</option><option value="cops">COPS shortage / surplus (AF)</option></select></label>
    <label class="ctl" for="pSize">Bubble size<select id="pSize"><option value="e24">2024-25 enrolment</option><option value="chp">Credit hours (CHP)</option><option value="absmar">|Total margin $|</option><option value="cr10">Credentials, 10-yr</option></select></label>
    <button class="btn" id="pReset" type="button">Reset to file defaults</button>
   </div>
  </details>
  <nav class="tabs" role="tablist" id="tabs"></nav>
 </div>
</div>

<div class="wrap">
 <header class="top">
  <h1>APR Portfolio Lens <small>Workstream D distribution analysis · 260 programs · 2024-25 costing</small></h1>
 </header>
 <main id="view"></main>
</div>
<div class="tip" id="tip" hidden></div>
<script src="data/programs.js?v=2026-10-03b"></script>
<script src="data/fiuc.js?v=2026-10-03b"></script>
<script src="data/guide.js?v=2026-10-03b"></script>
<script src="assets/app.js?v=2026-10-03b"></script>
</body>
</html>
